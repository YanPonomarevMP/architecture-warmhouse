version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    env_file:
      - local.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U postgres -p 5432"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature_api
      dockerfile: DockerFile
    container_name: temperature-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    env_file:
      - local.env
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge